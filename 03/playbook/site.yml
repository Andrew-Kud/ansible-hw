---
- name: Install ClickHouse
  hosts: clickhouse
  become: true
  tags:
    - clickhouse

  handlers:
    - name: Start clickhouse service
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted

  tasks:
    - name: Install ClickHouse components
      tags:
        - clickhouse_install
      block:
        - name: Create ClickHouse package directory
          ansible.builtin.file:
            path: "{{ clickhouse_download_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Download ClickHouse DEB packages
          ansible.builtin.get_url:
            url: >-
              https://packages.clickhouse.com/deb/pool/main/c/{{ item }}/{{ item }}_{{ clickhouse_version }}_{{ clickhouse_package_arch[item] }}.deb
            dest: >-
              {{ clickhouse_download_dir }}/{{ item }}_{{ clickhouse_version }}_{{ clickhouse_package_arch[item] }}.deb
            mode: "0644"
          loop: "{{ clickhouse_packages }}"

        - name: Install ClickHouse DEB packages
          ansible.builtin.apt:
            deb: >-
              {{ clickhouse_download_dir }}/{{ item }}_{{ clickhouse_version }}_{{ clickhouse_package_arch[item] }}.deb
            state: present
          loop: "{{ clickhouse_packages }}"
          notify: Start clickhouse service


- name: Install and configure Vector
  hosts: vector
  become: true
  tags:
    - vector_install

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Restart Vector
      ansible.builtin.service:
        name: vector
        state: restarted

  tasks:
    - name: Install and configure Vector components
      block:
        - name: Create Vector system group
          ansible.builtin.group:
            name: vector
            system: true

        - name: Create Vector system user
          ansible.builtin.user:
            name: vector
            group: vector
            system: true
            shell: /usr/sbin/nologin
            create_home: false

        - name: Create Vector directories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
          loop:
            - path: "{{ vector_release_dir }}"
              owner: root
              group: root
              mode: "0755"
            - path: "{{ vector_config_dir }}"
              owner: root
              group: vector
              mode: "0755"
            - path: "{{ vector_data_dir }}"
              owner: vector
              group: vector
              mode: "0755"

        - name: Download Vector archive
          ansible.builtin.get_url:
            url: "{{ vector_download_url }}"
            dest: "{{ vector_archive_path }}"
            mode: "0644"

        - name: Unarchive Vector distribution
          ansible.builtin.unarchive:
            src: "{{ vector_archive_path }}"
            dest: "{{ vector_release_dir }}"
            remote_src: true
            extra_opts:
              - --strip-components=2
            creates: "{{ vector_release_dir }}/bin/vector"

        - name: Create Vector current release symlink
          ansible.builtin.file:
            src: "{{ vector_release_dir }}"
            dest: "{{ vector_install_dir }}"
            state: link
          notify: Restart Vector

        - name: Deploy Vector systemd unit
          ansible.builtin.template:
            src: vector.service.j2
            dest: /etc/systemd/system/vector.service
            owner: root
            group: root
            mode: "0644"
          notify:
            - Reload systemd daemon
            - Restart Vector
          tags:
            - vector_config

        - name: Deploy Vector configuration
          ansible.builtin.template:
            src: vector.yaml.j2
            dest: "{{ vector_config_file }}"
            owner: root
            group: vector
            mode: "0640"
          notify: Restart Vector
          tags:
            - vector_config

        - name: Enable and start Vector service
          ansible.builtin.service:
            name: vector
            enabled: true
            state: started
          tags:
            - vector_service


- name: Install and configure LightHouse
  hosts: lighthouse
  become: true
  tags:
    - lighthouse_install

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

  tasks:
    - name: Install and configure LightHouse components
      block:
        - name: Install Nginx
          ansible.builtin.apt:
            name: nginx
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create LightHouse web root
          ansible.builtin.file:
            path: "{{ lighthouse_root }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Download LightHouse static page
          ansible.builtin.get_url:
            url: "{{ lighthouse_index_url }}"
            dest: "{{ lighthouse_index_path }}"
            owner: root
            group: root
            mode: "0644"

        - name: Configure Nginx for LightHouse
          ansible.builtin.template:
            src: lighthouse-nginx.conf.j2
            dest: "{{ lighthouse_nginx_config_path }}"
            owner: root
            group: root
            mode: "0644"
          notify: Reload Nginx
          tags:
            - lighthouse_config
            - lighthouse_nginx

        - name: Enable and start Nginx
          ansible.builtin.service:
            name: nginx
            enabled: true
            state: started
          tags:
            - lighthouse_service
            - lighthouse_nginx
