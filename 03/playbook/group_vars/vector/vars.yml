---
vector_version: "0.56.0"
vector_arch: "x86_64-unknown-linux-musl"

vector_download_url: >-
  https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz

vector_archive_path: "/tmp/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
vector_release_dir: "/opt/vector-{{ vector_version }}"
vector_install_dir: "/opt/vector"

vector_config_dir: "/etc/vector"
vector_config_file: "/etc/vector/vector.yaml"
vector_data_dir: "/var/lib/vector"
