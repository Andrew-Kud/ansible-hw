---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

#lint: |
#  yamllint .
#  ansible-lint

platforms:
  - name: oraclelinux8
    image: oraclelinux:8
    pre_build_image: false
    dockerfile: Dockerfile.oraclelinux8.j2
    command: /usr/sbin/init
    privileged: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      container: docker

  - name: ubuntu
    image: ubuntu:latest
    pre_build_image: false
    dockerfile: Dockerfile.ubuntu.j2
    command: /sbin/init
    privileged: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      container: docker

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
  options:
    diff: true

verifier:
  name: ansible
