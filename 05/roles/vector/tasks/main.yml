---
# tasks file for vector
- name: Create Vector system group
  ansible.builtin.group:
    name: "{{ vector_group }}"
    system: true

- name: Create Vector system user
  ansible.builtin.user:
    name: "{{ vector_user }}"
    group: "{{ vector_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Vector directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vector_release_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ vector_config_dir }}"
      owner: root
      group: "{{ vector_group }}"
      mode: "0755"
    - path: "{{ vector_data_dir }}"
      owner: "{{ vector_user }}"
      group: "{{ vector_group }}"
      mode: "0755"

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "{{ vector_download_url }}"
    dest: "{{ vector_archive_path }}"
    mode: "0644"

- name: Unarchive Vector distribution
  ansible.builtin.unarchive:
    src: "{{ vector_archive_path }}"
    dest: "{{ vector_release_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=2
    creates: "{{ vector_release_dir }}/bin/vector"

- name: Create Vector current release symlink
  ansible.builtin.file:
    src: "{{ vector_release_dir }}"
    dest: "{{ vector_install_dir }}"
    state: link
  notify: Restart Vector

- name: Deploy Vector systemd unit
  ansible.builtin.template:
    src: "{{ vector_systemd_unit_template }}"
    dest: "{{ vector_systemd_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart Vector

- name: Deploy Vector configuration
  ansible.builtin.template:
    src: "{{ vector_config_template }}"
    dest: "{{ vector_config_file }}"
    owner: root
    group: "{{ vector_group }}"
    mode: "0640"
  notify: Restart Vector

- name: Enable and start Vector service
  ansible.builtin.service:
    name: "{{ vector_service_name }}"
    enabled: true
    state: started
