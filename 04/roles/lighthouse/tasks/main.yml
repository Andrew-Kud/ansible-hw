---
# tasks file for lighthouse
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - lighthouse_install
    - lighthouse_nginx

- name: Create LightHouse web root
  ansible.builtin.file:
    path: "{{ lighthouse_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - lighthouse_install

- name: Download LightHouse static page
  ansible.builtin.get_url:
    url: "{{ lighthouse_index_url }}"
    dest: "{{ lighthouse_index_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx
  tags:
    - lighthouse_install

- name: Configure Nginx for LightHouse
  ansible.builtin.template:
    src: "{{ lighthouse_nginx_template }}"
    dest: "{{ lighthouse_nginx_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx
  tags:
    - lighthouse_config
    - lighthouse_nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: "{{ lighthouse_nginx_service_name }}"
    enabled: true
    state: started
  tags:
    - lighthouse_service
    - lighthouse_nginx
